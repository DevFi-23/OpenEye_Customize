name: Lint
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install verilator and PyYAML
        # Ubuntu 24.04 ships Verilator 5.020, the version the baseline was made with.
        run: sudo apt-get update && sudo apt-get install -y verilator python3-yaml

      - name: run verilator lint against the baseline
        # The RTL inherited from upstream has known warnings (tools/lint_baseline/).
        # Fail only on warnings that are not in the baseline. Lints both
        # hdl/OpenEye_Parallel.v (the former check) and the FPGA top level
        # hdl/OpenEye_FPGA.v, whose generated headers the script creates first.
        run: python3 tools/lint_check.py
